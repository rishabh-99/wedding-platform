# Development stack — no .env, AWS account or API keys required:
#
#   docker compose up
#
#   Guest site : http://localhost:3000
#   Admin      : http://localhost:3000/admin   (admin@wedding.local / ChangeMe!2026 — development only)
#   API        : http://localhost:4000/api/health
#
# Postgres runs in Docker, media is stored on a local Docker volume, realtime is local SSE,
# and emails are written to the backend log.
name: wedding-platform

x-dev-image: &dev-image
  build:
    context: .
    target: dev
  image: wedding-platform-dev:latest

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding
      POSTGRES_DB: wedding
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "55432:5432" # exposed on 55432 so it never clashes with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    <<: *dev-image
    restart: unless-stopped
    command: ["sh", "/app/docker/entrypoint.sh", "npm", "run", "dev", "-w", "backend"]
    environment:
      NODE_ENV: development
      PORT: 4000
      PUBLIC_URL: http://localhost:3000
      DATABASE_URL: postgresql://wedding:wedding@db:5432/wedding?schema=public
      TEST_DATABASE_URL: postgresql://wedding:wedding@db:5432/wedding_test?schema=public
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /data/media
      EMAIL_DRIVER: log
      SEED_ON_EMPTY: "true"
      SEED_DEMO_DATA: "true"
      LOG_LEVEL: info
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
      - ./backend/test:/app/backend/test
      - ./shared/src:/app/shared/src
      - media:/data/media
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    <<: *dev-image
    restart: unless-stopped
    command: ["npm", "run", "dev", "-w", "frontend"]
    environment:
      VITE_API_PROXY: http://backend:4000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html
      - ./shared/src:/app/shared/src
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
