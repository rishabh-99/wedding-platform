user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  sendfile        on;
  tcp_nopush      on;
  server_tokens   off;
  keepalive_timeout 65;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/json application/javascript
             application/xml application/rss+xml image/svg+xml font/woff2;

  # Default request size limit (uploads get a larger limit per-location).
  client_max_body_size 2m;

  # Basic abuse protection in front of the API (the app also rate-limits).
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  include /etc/nginx/conf.d/*.conf;
}
